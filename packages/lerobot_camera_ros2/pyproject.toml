[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_camera_ros2"
version = "0.1.0"
description = "LeRobot camera plugin for ROS 2 image topics"
requires-python = ">=3.10"
dependencies = ["lerobot>=0.4", "lerobot_ros2_context>=0.1.0", "numpy", "opencv-python-headless"]
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
