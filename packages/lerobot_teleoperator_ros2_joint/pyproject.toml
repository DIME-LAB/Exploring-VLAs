[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_teleoperator_ros2_joint"
version = "0.1.0"
description = "LeRobot teleoperator plugin for ROS 2 commanded joint topics"
requires-python = ">=3.10"
dependencies = ["lerobot>=0.4", "lerobot_ros2_context>=0.1.0"]
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
