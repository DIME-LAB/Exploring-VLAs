# OMPL Planning Configuration for SO-ARM101
# Reference: https://moveit.picknik.ai/humble/doc/examples/ompl_interface/ompl_interface_tutorial

planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

# FixStartStateCollision knobs — activate when start state is in collision:
#   jiggle_fraction          : max perturbation as fraction of joint range
#                              (0.02 = 2%). Covers servo tolerance + mesh edge
#                              cases without moving the arm observably.
#   max_sampling_attempts    : how many random perturbations to try before
#                              giving up and failing the plan.
jiggle_fraction: 0.02
max_sampling_attempts: 100

longest_valid_segment_fraction: 0.01
maximum_waypoint_distance: 0.01
simplify_solutions: false

planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 0
    optimization_objective: PathLengthOptimizationObjective

arm:
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
    - RRTstar
